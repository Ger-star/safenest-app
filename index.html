<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeNest Smart Control</title>
    <!-- Подключаем Firebase и графики -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11;
            color: #e4e4e7;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background: #16161e;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #27273a;
            padding-bottom: 10px;
        }
        .title { font-size: 20px; font-weight: bold; color: #38bdf8; }
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background-color: #6b7280; display: inline-block;
            box-shadow: 0 0 8px #6b7280;
        }
        .online { background-color: #10b981; box-shadow: 0 0 12px #10b981; }
        .gauge-container {
            position: relative; width: 200px; height: 100px;
            margin: 0 auto 30px auto; overflow: hidden;
            text-align: center;
        }
        .gauge-bg {
            width: 200px; height: 200px; border-radius: 50%;
            border: 15px solid #27273a; box-sizing: border-box;
        }
        .gauge-fill {
            position: absolute; top: 0; left: 0; width: 200px; height: 200px;
            border-radius: 50%; border: 15px solid #10b981;
            box-sizing: border-box; transform: rotate(0deg);
            clip-path: rotate(180deg);
        }
        .gauge-val {
            position: absolute; bottom: 0; left: 0; right: 0;
            font-size: 28px; font-weight: bold; color: #10b981;
        }
        .widgets-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;
        }
        .widget {
            background: #1f1f2e; border-radius: 15px; padding: 15px; text-align: center;
            border: 1px solid #27273a;
        }
        .widget-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
        .widget-value { font-size: 22px; font-weight: bold; margin-top: 5px; }
        .controls { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .control-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #1f1f2e; padding: 12px 15px; border-radius: 12px;
        }
        .btn {
            background: #38bdf8; color: #0d0d11; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;
        }
        .btn:active { background: #0ea5e9; }
        .btn-danger { background: #ef4444; color: white; }
        .slider { width: 120px; }
        /* Кастомный чекбокс-тумблер */
        .switch {
            position: relative; display: inline-block; width: 45px; height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #27273a; transition: .3s; border-radius: 24px;
        }
        .slider-toggle:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider-toggle { background-color: #38bdf8; }
        input:checked + .slider-toggle:before { transform: translateX(21px); }
        .chart-box { background: #1f1f2e; border-radius: 15px; padding: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="title">SafeNest Smart Panel</div>
        <div>Status: <span id="statusNode" class="status-dot"></span></div>
    </div>

    <!-- Анимированная шкала CO -->
    <div class="gauge-container">
        <div class="gauge-bg"></div>
        <div id="coValue" class="gauge-val">0.0 PPM</div>
    </div>

    <!-- Климат и аналитика -->
    <div class="widgets-grid">
        <div class="widget">
            <div class="widget-title">Температура</div>
            <div id="tempValue" class="widget-value">--.- °C</div>
        </div>
        <div class="widget">
            <div class="widget-title">Влажность</div>
            <div id="humValue" class="widget-value">--.- %</div>
        </div>
        <div class="widget" style="grid-column: span 2;">
            <div class="widget-title">Индекс тепла (Ощущается)</div>
            <div id="hiValue" class="widget-value">--.- °C</div>
        </div>
    </div>

    <!-- Панель управления -->
    <div class="controls">
        <div class="control-row">
            <span>🔇 Глушить сирену (Mute)</span>
            <label class="switch">
                <input type="checkbox" id="muteToggle" onchange="toggleMute()">
                <span class="slider-toggle"></span>
            </label>
        </div>
        <div class="control-row">
            <span>📺 Подсветка LCD экрана</span>
            <label class="switch">
                <input type="checkbox" id="lcdToggle" onchange="toggleLcd()" checked>
                <span class="slider-toggle"></span>
            </label>
        </div>
        <div class="control-row">
            <span>📉 Порог тревоги: <b id="threshLabel">100</b> PPM</span>
            <input type="range" id="threshSlider" class="slider" min="30" max="400" step="10" value="100" onchange="updateThresh()">
        </div>
        <button class="btn" onclick="triggerSnap()">📸 Сделать экспресс-фото</button>
        <button class="btn btn-danger" onclick="requestReboot()">🔄 Перезагрузить систему</button>
    </div>

    <!-- Суточный график -->
    <div class="chart-box">
        <canvas id="coChart" height="150"></canvas>
    </div>
</div>

<script>
    // Настройки вашей базы данных из скриншота
    const firebaseConfig = {
        databaseURL: "https://firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Переменные для графика
    const ctx = document.getElementById('coChart').getContext('2d');
    const coChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['12:00', '14:00', '16:00', '18:00', '20:00', '22:00'],
            datasets: [{
                label: 'Уровень CO (PPM)',
                data:,
                borderColor: '#38bdf8',
                tension: 0.4,
                fill: false
            }]
        },
        options: { responsive: true, plugins: { legend: { display: false } } }
    });

    // Чтение данных из Firebase в реальном времени
    db.ref("telemetry").on("value", (snapshot) => {
        const data = snapshot.val();
        if(data) {
            document.getElementById("tempValue").innerText = data.temperature.toFixed(1) + " °C";
            document.getElementById("humValue").innerText = data.humidity.toFixed(1) + " %";
            document.getElementById("hiValue").innerText = data.heat_index.toFixed(1) + " °C";
            document.getElementById("coValue").innerText = data.co_ppm.toFixed(1) + " PPM";
            
            // Меняем цвет индикатора при аварии
            if (data.co_ppm > data.threshold) {
                document.getElementById("coValue").style.color = "#ef4444";
            } else {
                document.getElementById("coValue").style.color = "#10b981";
            }
            
            document.getElementById("threshLabel").innerText = data.threshold;
            document.getElementById("threshSlider").value = data.threshold;
            document.getElementById("muteToggle").checked = data.is_muted;
            document.getElementById("lcdToggle").checked = data.lcd_backlight;
            
            // Статус онлайн
            const isOnline = (Date.now() - data.last_seen) < 7000;
            const dot = document.getElementById("statusNode");
            if (isOnline) dot.classList.add("online"); else dot.classList.remove("online");
        }
    });

    // Отправка команд на ESP32 через Firebase
    void toggleMute() {
        db.ref("control/is_muted").set(document.getElementById("muteToggle").checked);
    }
    void toggleLcd() {
        db.ref("control/lcd_backlight").set(document.getElementById("lcdToggle").checked);
    }
    void updateThresh() {
        db.ref("control/threshold").set(parseInt(document.getElementById("threshSlider").value));
    }
    void triggerSnap() {
        db.ref("control/command_snap").set(true);
        setTimeout(() => db.ref("control/command_snap").set(false), 2000);
    }
    void requestReboot() {
        if(confirm("Вы уверены, что хотите перезагрузить SafeNest?")) {
            db.ref("control/command_reboot").set(true);
        }
    }
</script>
</body>
</html>
